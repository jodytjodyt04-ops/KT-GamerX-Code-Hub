<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KT GamerX Code Hub</title>
<style>
:root{--bg:#0b0b14;--card:#14142a;--tx:#f4f4ff;--mut:#9a9ac0;--ac:#ffb400;--ac2:#3aa0ff;--bd:#2a2a50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f1fa;--card:#fff;--tx:#14142a;--mut:#5a5a80;--bd:#d8d8ee}}
:root[data-theme="light"]{--bg:#f1f1fa;--card:#fff;--tx:#14142a;--mut:#5a5a80;--bd:#d8d8ee}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 8px;text-align:center}
h1{margin:0;font-size:24px;background:linear-gradient(90deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:6px 0 0;color:var(--mut);font-size:14px}
main{max-width:1000px;margin:0 auto;padding:12px 14px 40px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.body{padding:12px}
.t{font-weight:700;margin-bottom:8px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--mut);max-height:84px;overflow:auto}
.row{display:flex;gap:8px;margin-top:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.copy{flex:1;background:var(--ac);color:#1a1200}
.copy.ok{background:#2ecc71;color:#032}
.like{background:var(--bg);color:var(--tx);border:1px solid var(--bd);min-width:78px}
.like.on{color:#ff4d6d;border-color:#ff4d6d}
.add{background:var(--ac2);color:#001;margin-top:4px}
.panel{max-width:520px;margin:0 auto 4px;padding:0 14px}
form{display:none;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:10px;gap:10px;flex-direction:column}
form.open{display:flex}
input,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.hint{font-size:12px;color:var(--mut)}
.top{text-align:center;padding:0 14px}
</style></head><body>
<header><h1>KT GamerX Code Hub</h1><p>Tap Copy to grab a code. Like your favourites. Add your own!</p></header>

<textarea id="fc" rows="3" placeholder="Paste code here" maxlength="600" required></textarea>
<input id="fi" type="file" accept="image/*" required>
<div class="hint" id="fh">Pick an image for your code card.</div>
<button class="copy" type="submit" id="fs">Add</button>
</form></div>
