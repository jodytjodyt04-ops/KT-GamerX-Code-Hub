<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b14">
<title>KT GamerX Code Hub</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b0b14;
  --card: #14142a;
  --text: #f4f4ff;
  --muted: #9a9ac0;
  --border: #2a2a50;
  --gold: #ffb400;
  --blue: #3aa0ff;
  --like: #ff4d6d;
  --ok: #2ecc71;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1f1fa;
  --card: #fff;
  --text: #14142a;
  --muted: #5a5a80;
  --border: #d8d8ee;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
}

header {
  padding: 65px 16px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: clamp(24px, 5vw, 36px);
  background: linear-gradient(90deg, var(--blue), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

header p {
  color: var(--muted);
  font-size: 14px;
}

.btn {
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
}

.btn:active { transform: scale(.97); }

.btn-gold { background: var(--gold); color: #1a1200; }
.btn-blue { background: var(--blue); color: #001; }
.btn-gold.copied { background: var(--ok); color: #032; }

.btn-like {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  min-width: 80px;
}

.btn-like.liked {
  color: var(--like);
  border-color: var(--like);
}

.theme-btn {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10;
  width: 44px;
  height: 44px;
  padding: 0;
  font-size: 20px;
  border-radius: 50%;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
}

#addForm {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 520px;
  margin: 12px auto 24px;
  padding: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
}

#addForm[hidden] { display: none; }

input, textarea {
  font: inherit;
  width: 100%;
  padding: 11px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.hint {
  margin: 0;
  font-size: 12px;
  color: var(--muted);
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 12px 14px 40px;
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  min-width: 0;
}

.card img {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: var(--bg);
}

.card-body { padding: 12px; }
.card-title { margin-bottom: 8px; font-weight: 700; }

.card-code {
  max-height: 84px;
  overflow: auto;
  padding: 10px;
  font: 12px ui-monospace, monospace;
  overflow-wrap: anywhere;
  color: var(--muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.card-actions .btn-gold { flex: 1; }

.status {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 0 12px 20px;
}

@media (max-width: 400px) {
  main { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<button id="themeToggle" class="btn theme-btn"
        aria-label="Switch theme">☀️</button>

<header>
  <h1>KT GamerX Code Hub</h1>
  <p>Tap Copy to grab a code. Like your favourites. Add your own!</p>
  <button id="toggleForm" class="btn btn-blue">
    + Add your code here
  </button>
</header>

<form id="addForm" hidden>
  <input id="titleInput" type="text"
         placeholder="Title (e.g. Xayne + Oscar)"
         maxlength="60" required>

  <textarea id="codeInput" rows="3"
            placeholder="Paste code here"
            maxlength="600" required></textarea>

  <input id="imageInput" type="file"
         accept="image/jpeg,image/png,image/webp"
         required>

  <p id="formMessage" class="hint" aria-live="polite"></p>
  <button type="submit" class="btn btn-gold">Add Code</button>
</form>

<main id="grid"></main>
<p class="status" id="pageStatus" aria-live="polite"></p>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", () => {

  // Replace these image URLs with your own images if required.
  const CARDS = [
    {
      id: "c1",
      title: "Chrono vs Xayne",
      image: "https://placehold.co/640x360/14142a/3aa0ff?text=Chrono+vs+Xayne",
      code: "#FF#cGl/YXVzeXFwf3V5cWRxfnVuY2V5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rxdw=="
    },
    {
      id: "c2",
      title: "Xayne + Oscar",
      image: "https://placehold.co/640x360/14142a/ffb400?text=Xayne+%2B+Oscar",
      code: "#FF#cGl7bXV9eXFwf3V5cGJxfnVsZGV5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rxdw=="
    },
    {
      id: "c3",
      title: "K + Skyler",
      image: "https://placehold.co/640x360/14142a/2ecc71?text=K+%2B+Skyler",
      code: "#FF#cGl4aXV6eXZwf3V5dGJxeXVtY2V5YnR/fGl1e291cGlyb3B0cHtiamRlf3RxeA=="
    },
    {
      id: "c4",
      title: "Orion + A124",
      image: "https://placehold.co/640x360/14142a/ff4d6d?text=Orion+%2B+A124",
      code: "#FF#cGl6a3V6eXR9f3V5dGJxfnVrbGV5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rwfw=="
    },
    {
      id: "c5",
      title: "Santino + Xayne",
      image: "https://placehold.co/640x360/14142a/3aa0ff?text=Santino+%2B+Xayne",
      code: "#FF#cGl6aXV9eXFwf3V5dGJxfnVrbGV5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rwfw=="
    },
    {
      id: "c6",
      title: "Dimitri + Xayne",
      image: "https://placehold.co/640x360/14142a/ffb400?text=Dimitri+%2B+Xayne",
      code: "#FF#cGl4bnV+eXFwf3J5cWRxe3VuY2V5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rxdw=="
    },
    {
      id: "c7",
      title: "Oscar + Tatsuya",
      image: "https://placehold.co/640x360/14142a/2ecc71?text=Oscar+%2B+Tatsuya",
      code: "#FF#cGl7bXV9eXB8f3V5dmdxfHVtbWV5YnR/fGl1e291cWlyb3B0cHtiamRlf3RwfQ=="
    }
  ];

  const STORE_CARDS = "kt_user_cards";
  const STORE_LIKES = "kt_likes";
  const STORE_MINE = "kt_likes_mine";
  const STORE_THEME = "kt_theme";

  const grid = document.getElementById("grid");
  const form = document.getElementById("addForm");
  const message = document.getElementById("formMessage");
  const pageStatus = document.getElementById("pageStatus");
  const themeBtn = document.getElementById("themeToggle");

  function load(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value === null ? fallback : JSON.parse(value);
    } catch {
      return fallback;
    }
  }

  function save(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  }

  let userCards = load(STORE_CARDS, []);
  let likes = load(STORE_LIKES, {});
  let liked = new Set(load(STORE_MINE, []));

  if (!Array.isArray(userCards)) userCards = [];
  if (!likes || typeof likes !== "object" || Array.isArray(likes)) likes = {};
  if (!Array.isArray(load(STORE_MINE, []))) liked = new Set();

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    themeBtn.textContent = theme === "light" ? "🌙" : "☀️";
    themeBtn.setAttribute(
      "aria-label",
      theme === "light" ? "Switch to dark mode" : "Switch to light mode"
    );
  }

  let initialTheme = load(STORE_THEME, null);

  if (initialTheme !== "light" && initialTheme !== "dark") {
    initialTheme = window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: light)").matches
      ? "light" : "dark";
  }

  applyTheme(initialTheme);

  themeBtn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light"
      ? "dark" : "light";

    applyTheme(next);
    save(STORE_THEME, next);
  });

  document.getElementById("toggleForm").addEventListener("click", () => {
    form.hidden = !form.hidden;

    if (!form.hidden) {
      document.getElementById("titleInput").focus();
      form.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function cardHtml(card) {
    const count = Math.max(0, Number(likes[card.id]) || 0);
    const isLiked = liked.has(card.id);

    return `
      <article class="card">
        <img
          src="${escapeHtml(card.image || "")}"
          alt="${escapeHtml(card.title)}"
          loading="lazy"
          onerror="this.onerror=null;this.src='https://placehold.co/640x360/14142a/ffffff?text=KT+GamerX';"
        >

        <div class="card-body">
          <div class="card-title">${escapeHtml(card.title)}</div>

          <div class="card-code">${escapeHtml(card.code)}</div>

          <div class="card-actions">
            <button class="btn btn-gold" data-copy="${escapeHtml(card.id)}">
              Copy
            </button>

            <button
              class="btn btn-like ${isLiked ? "liked" : ""}"
              data-like="${escapeHtml(card.id)}"
              aria-pressed="${isLiked}"
              aria-label="Like ${escapeHtml(card.title)}"
            >
              ${isLiked ? "♥" : "♡"} ${count}
            </button>
          </div>
        </div>
      </article>
    `;
  }

  function render() {
    grid.innerHTML = [...CARDS, ...userCards].map(cardHtml).join("");
    pageStatus.textContent = `${CARDS.length + userCards.length} codes available`;
  }

  async function copyText(value) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return true;
      }
    } catch {}

    const area = document.createElement("textarea");
    area.value = value;
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();

    let success = false;

    try {
      success = document.execCommand("copy");
    } catch {}

    area.remove();
    return success;
  }

  grid.addEventListener("click", async event => {
    const copyBtn = event.target.closest("[data-copy]");
    const likeBtn = event.target.closest("[data-like]");
    const allCards = [...CARDS, ...userCards];

    if (copyBtn) {
      const card = allCards.find(c => c.id === copyBtn.dataset.copy);
      if (!card) return;

      const success = await copyText(card.code);
      copyBtn.textContent = success ? "Copied ✓" : "Copy failed";
      copyBtn.classList.toggle("copied", success);

      if (success) {
        setTimeout(() => {
          if (copyBtn.isConnected) {
            copyBtn.textContent = "Copy";
            copyBtn.classList.remove("copied");
          }
        }, 1500);
      }

      return;
    }

    if (likeBtn) {
      const id = likeBtn.dataset.like;

      if (liked.has(id)) {
        liked.delete(id);
        likes[id] = Math.max(0, (Number(likes[id]) || 0) - 1);
      } else {
        liked.add(id);
        likes[id] = (Number(likes[id]) || 0) + 1;
      }

      const likesSaved = save(STORE_LIKES, likes);
      const mineSaved = save(STORE_MINE, [...liked]);

      render();

      if (!likesSaved || !mineSaved) {
        pageStatus.textContent = "Warning: browser storage could not save your likes.";
      }
    }
  });

  function shrinkImage(file, maxWidth = 640, quality = 0.7) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith("image/")) {
        reject(new Error("Please select an image."));
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        reject(new Error("Image must be smaller than 10 MB."));
        return;
      }

      const objectURL = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        try {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");

          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));

          const context = canvas.getContext("2d");

          if (!context) throw new Error("Image processing failed.");

          context.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob(blob => {
            URL.revokeObjectURL(objectURL);

            if (!blob) {
              reject(new Error("Could not process the image."));
              return;
            }

            const reader = new FileReader();

            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("Could not read the image."));
            reader.readAsDataURL(blob);
          }, "image/jpeg", quality);

        } catch (error) {
          URL.revokeObjectURL(objectURL);
          reject(error);
        }
      };

      img.onerror = () => {
        URL.revokeObjectURL(objectURL);
        reject(new Error("Could not load this image."));
      };

      img.src = objectURL;
    });
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    message.textContent = "Processing image...";

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;

    try {
      const title = document.getElementById("titleInput").value.trim();
      const code = document.getElementById("codeInput").value.trim();
      const file = document.getElementById("imageInput").files[0];

      if (!title || !code || !file) {
        throw new Error("Please complete every field.");
      }

      const image = await shrinkImage(file);

      const newCard = {
        id: "u" + Date.now() + Math.random().toString(36).slice(2, 7),
        title,
        code,
        image
      };

      const updatedCards = [...userCards, newCard];

      if (!save(STORE_CARDS, updatedCards)) {
        throw new Error("Storage is full. Remove some saved cards or use a smaller image.");
      }

      userCards = updatedCards;
      form.reset();
      message.textContent = "Code added successfully!";
      render();

    } catch (error) {
      message.textContent = error.message || "Could not add this code.";
    } finally {
      submitBtn.disabled = false;
    }
  });

  render();
});
</script>

</body>
</html>
