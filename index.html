<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KT GamerX Code Hub</title>

  <style>
    /* ---------- Night mode (default) ---------- */
    :root {
      --bg: #0b0b14;
      --card: #14142a;
      --text: #f4f4ff;
      --muted: #9a9ac0;
      --border: #2a2a50;
      --gold: #ffb400;
      --blue: #3aa0ff;
      --like: #ff4d6d;
      --ok: #2ecc71;
    }

    /* ---------- Day mode ---------- */
    :root[data-theme="light"] {
      --bg: #f1f1fa;
      --card: #ffffff;
      --text: #14142a;
      --muted: #5a5a80;
      --border: #d8d8ee;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    header {
      padding: 60px 16px 8px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      background: linear-gradient(90deg, var(--blue), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: var(--muted);
      font-size: 14px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .btn-gold { background: var(--gold); color: #1a1200; }
    .btn-blue { background: var(--blue); color: #001; }
    .btn-gold.copied { background: var(--ok); color: #032; }

    .btn-like {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      min-width: 80px;
    }

    .btn-like.liked {
      color: var(--like);
      border-color: var(--like);
    }

    .theme-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 20px;
      border-radius: 50%;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
    }

    /* ---------- Add form ---------- */
    #addForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 520px;
      margin: 12px auto;
      padding: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    #addForm[hidden] { display: none; }

    input, textarea {
      font: inherit;
      width: 100%;
      padding: 10px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .hint {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* ---------- Cards ---------- */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 12px 14px 40px;
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .card-body { padding: 12px; }

    .card-title {
      font-weight: 700;
    }

    .card-by {
      margin: 2px 0 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .card-code {
      max-height: 84px;
      overflow: auto;
      padding: 10px;
      font: 12px ui-monospace, Menlo, Consolas, monospace;
      word-break: break-all;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .card-actions .btn-gold { flex: 1; }
  </style>
</head>

<body>

  <button id="themeToggle" class="btn theme-btn" aria-label="Switch day / night">🌙</button>

  <header>
    <h1>KT GamerX Code Hub</h1>
    <p>Tap Copy to grab a code. Like your favourites. Add your own!</p>
    <button id="toggleForm" class="btn btn-blue">+ Add your code here</button>
  </header>

  <form id="addForm" hidden>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="30" required>
    <input id="titleInput" type="text" placeholder="Title (e.g. Xayne + Oscar)" maxlength="60" required>
    <textarea id="codeInput" rows="3" placeholder="Paste code here" maxlength="600" required></textarea>
    <input id="imageInput" type="file" accept="image/*" required>
    <p id="formMessage" class="hint"></p>
    <button id="submitBtn" type="submit" class="btn btn-gold">Add</button>
  </form>

  <main id="grid"></main>

  <script type="module">
    // =====================================================
    //  1. FIREBASE  (paste YOUR values from step 4)
    // =====================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "PASTE_HERE",
      authDomain: "PASTE_HERE",
      projectId: "PASTE_HERE",
      storageBucket: "PASTE_HERE",
      messagingSenderId: "PASTE_HERE",
      appId: "PASTE_HERE"
    };

    const isSetUp = firebaseConfig.apiKey !== "PASTE_HERE";
    let db = null;

    if (isSetUp) {
      db = getFirestore(initializeApp(firebaseConfig));
    }

    // =====================================================
    //  2. BUILT-IN CARDS  (images are in the images folder)
    // =====================================================
    const CARDS = [
      { id: "c1", title: "Chrono vs Xayne", image: "images/1.jpg", by: "KT GamerX",
        code: "#FF#cGl/YXVzeXFwf3V5cWRxfnVuY2V5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rxdw==" },

      { id: "c2", title: "Xayne + Oscar", image: "images/2.jpg", by: "KT GamerX",
        code: "#FF#cGl7bXV9eXFwf3V5cGJxfnVsZGV5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rxdw==" },

      { id: "c3", title: "K + Skyler", image: "images/3.jpg", by: "KT GamerX",
        code: "#FF#cGl4aXV6eXZwf3V5dGJxeXVtY2V5YnR/fGl1e291cGlyb3B0cHtiamRlf3RxeA==" },

      { id: "c4", title: "Orion + A124", image: "images/4.jpg", by: "KT GamerX",
        code: "#FF#cGl6a3V6eXR9f3V5dGJxfnVrbGV5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rwfw==" },

      { id: "c5", title: "Santino + Xayne", image: "images/5.jpg", by: "KT GamerX",
        code: "#FF#cGl6aXV9eXFwf3V5dGJxfnVrbGV5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rwfw==" },

      { id: "c6", title: "Dimitri + Xayne", image: "images/6.jpg", by: "KT GamerX",
        code: "#FF#cGl4bnV+eXFwf3J5cWRxe3VuY2V5YnR/fGl1e291cGlyb3B0cHtiamRlf3Rxdw==" },

      { id: "c7", title: "Oscar + Tatsuya", image: "images/7.jpg", by: "KT GamerX",
        code: "#FF#cGl7bXV9eXB8f3V5dmdxfHVtbWV5YnR/fGl1e291cWlyb3B0cHtiamRlf3RwfQ==" }
    ];

    // =====================================================
    //  3. STATE
    // =====================================================
    let sharedCards = [];       // cards added by everyone (from Firebase)
    let likeCount = {};         // { cardId: number }
    let myLikes = new Set();    // cards this device liked

    // Each device gets a random id so one device = one like per card
    let deviceId = localStorage.getItem("kt_device");
    if (!deviceId) {
      deviceId = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("kt_device", deviceId);
    }

    // =====================================================
    //  4. DAY / NIGHT SWITCH
    // =====================================================
    const themeBtn = document.getElementById("themeToggle");
    const savedTheme = localStorage.getItem("kt_theme");
    const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeBtn.textContent = theme === "light" ? "🌙" : "☀️";
    }

    applyTheme(savedTheme || (prefersLight ? "light" : "dark"));

    themeBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme");
      const next = current === "light" ? "dark" : "light";
      applyTheme(next);
      localStorage.setItem("kt_theme", next);
    });

    // =====================================================
    //  5. SHOW THE CARDS
    // =====================================================
    const grid = document.getElementById("grid");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function cardHtml(card) {
      const count = likeCount[card.id] || 0;
      const isLiked = myLikes.has(card.id);

      return `
        <article class="card">
          <img src="${escapeHtml(card.image)}" alt="${escapeHtml(card.title)}">
          <div class="card-body">
            <div class="card-title">${escapeHtml(card.title)}</div>
            <div class="card-by">Added by ${escapeHtml(card.by || "Unknown")}</div>
            <div class="card-code">${escapeHtml(card.code)}</div>
            <div class="card-actions">
              <button class="btn btn-gold" data-copy="${escapeHtml(card.id)}">Copy</button>
              <button class="btn btn-like ${isLiked ? "liked" : ""}" data-like="${escapeHtml(card.id)}">
                ${isLiked ? "♥" : "♡"} ${count}
              </button>
            </div>
          </div>
        </article>`;
    }

    function render() {
      grid.innerHTML = [...CARDS, ...sharedCards].map(cardHtml).join("");
    }

    render();

    // =====================================================
    //  6. LIVE DATA FROM FIREBASE
    // =====================================================
    if (db) {
      // All shared cards, oldest first
      onSnapshot(collection(db, "cards"), (snapshot) => {
        sharedCards = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
        sharedCards.sort((a, b) => (a.at || 0) - (b.at || 0));
        render();
      });

      // All likes
      onSnapshot(collection(db, "likes"), (snapshot) => {
        likeCount = {};
        myLikes = new Set();

        snapshot.docs.forEach((d) => {
          const like = d.data();
          likeCount[like.card] = (likeCount[like.card] || 0) + 1;
          if (like.device === deviceId) myLikes.add(like.card);
        });

        render();
      });
    }

    // =====================================================
    //  7. COPY
    // =====================================================
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand("copy");
        area.remove();
        return ok;
      }
    }

    // =====================================================
    //  8. CLICKS (copy + like)
    // =====================================================
    grid.addEventListener("click", async (event) => {
      const copyBtn = event.target.closest("[data-copy]");
      const likeBtn = event.target.closest("[data-like]");

      // ----- Copy -----
      if (copyBtn) {
        const card = [...CARDS, ...sharedCards].find((c) => c.id === copyBtn.dataset.copy);
        const ok = await copyText(card.code);

        copyBtn.textContent = ok ? "Copied ✓" : "Copy failed";
        copyBtn.classList.toggle("copied", ok);

        setTimeout(() => {
          copyBtn.textContent = "Copy";
          copyBtn.classList.remove("copied");
        }, 1500);
      }

      // ----- Like / Unlike (saved online for everyone) -----
      if (likeBtn) {
        if (!db) {
          alert("Firebase is not set up yet, so likes can't be saved.");
          return;
        }

        const cardId = likeBtn.dataset.like;
        const likeRef = doc(db, "likes", cardId + "_" + deviceId);

        if (myLikes.has(cardId)) {
          await deleteDoc(likeRef);
        } else {
          await setDoc(likeRef, { card: cardId, device: deviceId });
        }
      }
    });

    // =====================================================
    //  9. ADD YOUR OWN CODE
    // =====================================================
    const form = document.getElementById("addForm");
    const message = document.getElementById("formMessage");
    const submitBtn = document.getElementById("submitBtn");
    const nameInput = document.getElementById("nameInput");

    // Remember the person's name
    nameInput.value = localStorage.getItem("kt_name") || "";

    document.getElementById("toggleForm").addEventListener("click", () => {
      form.hidden = !form.hidden;
    });

    // Make the picked image smaller so it fits in the database
    function shrinkImage(file, maxWidth = 640) {
      return new Promise((resolve, reject) => {
        const img = new Image();

        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };

        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!db) {
        message.textContent = "Firebase is not set up yet. Paste your firebaseConfig first.";
        return;
      }

      submitBtn.disabled = true;
      message.textContent = "Uploading...";

      try {
        const file = document.getElementById("imageInput").files[0];
        const image = await shrinkImage(file);
        const name = nameInput.value.trim();

        localStorage.setItem("kt_name", name);

        const newId = "u" + Date.now() + Math.random().toString(36).slice(2, 6);

        await setDoc(doc(db, "cards", newId), {
          title: document.getElementById("titleInput").value.trim(),
          code: document.getElementById("codeInput").value.trim(),
          by: name,
          image: image,
          at: Date.now()
        });

        message.textContent = "Added! Everyone can see it now.";
        document.getElementById("titleInput").value = "";
        document.getElementById("codeInput").value = "";
        document.getElementById("imageInput").value = "";
      } catch (e) {
        message.textContent = "Could not add. Check your Firebase rules and try again.";
      }

      submitBtn.disabled = false;
    });
  </script>
</body>
</html>
